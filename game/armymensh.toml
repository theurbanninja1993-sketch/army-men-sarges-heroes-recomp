# Army Men: Sarge's Heroes (JUE), T-9715N V1.001 -- dreamcomp game config.
# Format: dreamcomp/engine/docs/game-config.md. Measured on the owner's disc; never commit disc data.

[game]
id = "armymensh"
title = "Army Men: Sarge's Heroes"
region = "JUE"
product = "T-9715N"

[disc]
sha1_1st_read = "51384b12a9de6d9a44caecaadafd29dca86807cf"   # the boot file this config was measured against
gdrom = true   # the game is GD-ROM (IP.BIN device "GD-ROM1/1"); the image is a CD-format copy
                 # whose tracks sit below LBA 45000, so the engine would otherwise report CD-ROM XA
                 # and the game loops on drive init (measured 2026-10-20)

[binary]
path = "extracted/fs/1ST_READ.BIN"   # written by tools/dc.py setup, git-ignored
load_address = 0x8C010000
link_address = 0x0C010000
entry = 0x8C010000

# [[relocations]] and [functions] extra: paste from --suggest-config, with a comment saying how
# each was found. [hooks]: see dreamcomp docs/HOOKS.md.

# Found by `dc.py report --frames 1800 -- --suggest-config`, boot loop round 1: the boot code
# copies these image regions into low RAM and runs them from there. Untranslated call
# targets 0x8c000000 and 0x8c000600 are both inside these copies.
[[relocations]]  # RAM 0x8c000000 reproduces image 0x0c0faa7c for 52 bytes
source = 0x0C0FAA7C
size = 0x34
dest = 0x8C000000
[[relocations]]  # RAM 0x8c000078 reproduces image 0x0c079428 for 56 bytes
source = 0x0C079428
size = 0x38
dest = 0x8C000078
[[relocations]]  # RAM 0x8c000100 reproduces image 0x0c0fa9e8 for 52 bytes
source = 0x0C0FA9E8
size = 0x34
dest = 0x8C000100
[[relocations]]  # RAM 0x8c000400 reproduces image 0x0c0fa9e8 for 52 bytes
source = 0x0C0FA9E8
size = 0x34
dest = 0x8C000400
[[relocations]]  # RAM 0x8c000600 reproduces image 0x0c0faa20 for 88 bytes
source = 0x0C0FAA20
size = 0x58
dest = 0x8C000600

# Found by untranslated call targets, boot loop round 2: code in the boot binary's own image
# (file offset 0x12AD34 onwards) that discovery did not find. How the game reaches it is not yet known.
[functions]
extra = [0x8C13AD34, 0x8C13AD7E, 0x8C13AE10, 0x8C13AE1A, 0x8C13AE56, 0x8C13AECE, 0x8C13AF62, 0x8C13AF72,
         0x0C0FC766, 0x0C0FC770]  # 0x0C0FC766/0x0C0FC770: reached when START is pressed (shots run)
