# Story prose uses the resident font atlas. Keep every glyph in the central
# paragraph on the same center anchor, including isolated final words/letters.
# The vertical range starts below the player-setup name lines (y=172..187) so the
# same font's "Green Sarge Normal" / "Tan Vikki Normal" lines are not split.
# It excludes the gameplay health/ammo and radar overlays.
rect=0,190,640,320 anchor=center tcw=0x04060010

# Player set-up left panel: the full-width green frame is centred by the HUD pass,
# so its left panel's colour, name and emblem must be centred with it rather than
# anchored to the screen's left edge. The panel's tile clips move with the frame.
rect=0,100,320,260 anchor=center tcw=0x04060010,0x0007bf10

# The name text can use a different texture word on the return-to-setup path.
# Catch the left name band by position so it follows the centred frame there too.
# Only small textured pieces: this keeps the multiplayer radar (large) and its
# untextured enemy markers out of it.
rect=0,100,300,188 anchor=center textured=1 max_w=40 max_h=40 tcw_min=0x04000000

# The player's emblem texture word can differ per profile. Catch the emblem band
# by position (below the name lines, above the lower panel) so it follows the
# centred frame regardless of its texture. Require a textured, panel-sized piece
# so the radar's small untextured markers are not caught.
rect=0,188,300,260 anchor=center textured=1 min_w=20 min_h=20

# The dark panel behind the two player boxes is untextured and covers both the
# upper character rows and the lower empty rows. Its centre (y~271) is below the
# background plane's, so this rectangle targets it without touching the camo
# backdrop. Move it with the centred green frame so it ends at the frame's edge.
rect=30,250,614,448 anchor=center tcw=0 min_w=100 min_h=100

# Native cutscene frame strips sit at/outside x=0 and x=640. They must stay at
# those screen edges, rather than joining into one centered HUD element.
rect=-4,-4,4,484 anchor=stretch tcw=0
rect=636,-4,644,484 anchor=stretch tcw=0

# The enemy target ring is a world-space billboard, submitted as two triangles.
# Tiny differences in their vertex depths make automatic HUD detection alternate
# between correcting it and leaving it alone, shifting the ring off its target.
# Preserve its projected coordinates at every position and size.
# Scorch stores the identical marker at the separately measured 0x9007ae78.
rect=-65536,-65536,65536,65536 anchor=stretch tcw=0x9007b3d0,0x9007ae78 full=1

# Sniper scope overlay: keep the 4:3 scope texture at its native shape so the
# crosshair stays circular, and fill the extra width of the aiming player's
# viewport with black (the full screen, or that player's half in split screen).
rect=0,0,640,480 anchor=center tcw=0x1006e910,0x1006e900 full=1 bars=1
